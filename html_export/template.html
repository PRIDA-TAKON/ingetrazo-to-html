<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>__MODEL_TITLE__ — IngeTrazo 3D Web Viewer</title>
  <style>
    :root {
      --bg-color: #e6e8eb;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: rgba(33, 43, 59, 0.15);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --btn-bg: rgba(241, 245, 249, 0.9);
      --btn-hover: #ffffff;
      --edge-color: #212b3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      transition: background-color 0.25s ease;
    }

    #viewport-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Top Branding & Info */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .badge-icon {
      width: 22px;
      height: 22px;
      display: inline-block;
    }

    .model-info h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--text-main);
    }

    .model-info p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Floating Toolbar */
    .floating-toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 5px 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
    }

    .tool-btn {
      background: var(--btn-bg);
      border: 1px solid rgba(0, 0, 0, 0.06);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .tool-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .tool-btn.active {
      background: rgba(2, 132, 199, 0.12);
      border-color: var(--accent);
      color: var(--accent);
    }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(0, 0, 0, 0.1);
      margin: 0 2px;
    }

    /* Right Views */
    .view-presets {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 5px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .preset-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .preset-btn:hover {
      background: var(--btn-hover);
      color: var(--accent);
    }

    /* Stats Card */
    .stats-card {
      position: absolute;
      top: 80px;
      left: 20px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 12px;
      color: var(--text-muted);
      display: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .stats-card.visible {
      display: block;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 6px;
    }

    .stats-row span.val {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Mini CAD Orientation Gizmo */
    #gizmo-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 76px;
      height: 76px;
      z-index: 10;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .top-bar { top: 10px; left: 10px; }
      .view-presets { top: 10px; right: 10px; }
      .floating-toolbar { bottom: 12px; padding: 4px; gap: 4px; }
      .tool-btn { padding: 5px 8px; font-size: 11px; }
      #gizmo-container { display: none; }
    }
  </style>
</head>
<body>
  <div id="viewport-container"></div>
  <div id="gizmo-container"></div>

  <!-- Top Title Badge -->
  <div class="top-bar">
    <div class="badge">
      <svg class="badge-icon" viewBox="0 0 24 24" fill="none">
        <polygon points="12,2.5 20.5,7.2 12,11.9 3.5,7.2" stroke="#212b3b" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="3.5,7.2 12,11.9 12,21.5 3.5,16.8" stroke="#212b3b" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="20.5,7.2 12,11.9 12,21.5 20.5,16.8" stroke="#212b3b" stroke-width="1.8" stroke-linejoin="round"/>
        <polyline points="9,14.2 6.5,15.7 9,17.2" stroke="#0284c7" stroke-width="1.7" stroke-linecap="round"/>
        <polyline points="15,14.2 17.5,15.7 15,17.2" stroke="#0284c7" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <div class="model-info">
        <h1>__MODEL_TITLE__</h1>
        <p>IngeTrazo Architectural View • __MODEL_DATE__</p>
      </div>
    </div>
  </div>

  <!-- Quick Views -->
  <div class="view-presets">
    <button class="preset-btn" onclick="setView('iso')">3D ISO</button>
    <button class="preset-btn" onclick="setView('top')">TOP (XY)</button>
    <button class="preset-btn" onclick="setView('front')">FRONT (XZ)</button>
    <button class="preset-btn" onclick="setView('right')">RIGHT (YZ)</button>
  </div>

  <!-- Floating Toolbar -->
  <div class="floating-toolbar">
    <button class="tool-btn" onclick="resetCamera()" title="Reset Camera View">
      <span>🎯</span> Reset
    </button>
    <div class="divider"></div>
    <button class="tool-btn active" id="btn-edges" onclick="toggleEdges()" title="Toggle IngeTrazo Edges">
      <span>✒️</span> Edges
    </button>
    <button class="tool-btn active" id="btn-grid" onclick="toggleGrid()" title="Toggle Ground Grid">
      <span>📐</span> Grid
    </button>
    <button class="tool-btn" id="btn-style" onclick="cycleStyle()" title="IngeTrazo Display Style">
      <span>🎨</span> <span id="style-name">IngeTrazo</span>
    </button>
    <div class="divider"></div>
    <button class="tool-btn" id="btn-info" onclick="toggleStats()" title="Model Statistics">
      <span>📊</span> Info
    </button>
    <button class="tool-btn" onclick="toggleFullscreen()" title="Fullscreen">
      <span>⛶</span>
    </button>
  </div>

  <!-- Model Stats Card -->
  <div class="stats-card" id="stats-card">
    <div class="stats-row"><span>Faces / Triangles:</span><span class="val" id="stat-triangles">-</span></div>
    <div class="stats-row"><span>IngeTrazo Edges:</span><span class="val" id="stat-edges">-</span></div>
    <div class="stats-row"><span>Textures:</span><span class="val" id="stat-textures">-</span></div>
    <div class="stats-row"><span>Vertices:</span><span class="val" id="stat-vertices">-</span></div>
    <div class="stats-row"><span>Dimensions (W×L×H):</span><span class="val" id="stat-dims">-</span></div>
    <div class="stats-row"><span>Center Datum:</span><span class="val" id="stat-center">-</span></div>
  </div>

  <!-- Embedded Three.js Engine -->
  <script>
/* __THREE_JS__ */
  </script>

  <!-- Embedded OrbitControls -->
  <script>
/* __ORBIT_CONTROLS__ */
  </script>

  <!-- Model Data & Interactive Viewer Script -->
  <script>
    const MODEL_PAYLOAD = /* __MODEL_DATA__ */;

    // Set Default Up vector to Z-up (+Z is Sky in IngeTrazo / BIM CAD)
    if (THREE.Object3D.DefaultUp) {
      THREE.Object3D.DefaultUp.set(0, 0, 1);
    }

    const container = document.getElementById('viewport-container');
    const scene = new THREE.Scene();

    // Default IngeTrazo Background Color (0.90, 0.91, 0.92 -> #e6e8eb)
    const INGETRAZO_BG = 0xe6e8eb;
    scene.background = new THREE.Color(INGETRAZO_BG);

    // Camera setup
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.LinearToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    // Gizmo Renderer (Mini orientation axis)
    const gizmoContainer = document.getElementById('gizmo-container');
    const gizmoRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    gizmoRenderer.setSize(76, 76);
    gizmoContainer.appendChild(gizmoRenderer.domElement);

    const gizmoScene = new THREE.Scene();
    const gizmoCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 50);
    gizmoCamera.up.set(0, 0, 1);

    const axesHelper = new THREE.AxesHelper(2.5);
    // Custom colors: X = Red, Y = Green, Z = Blue (IngeTrazo / CAD standard)
    gizmoScene.add(axesHelper);

    // OrbitControls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.screenSpacePanning = true;
    controls.maxPolarAngle = Math.PI - 0.02;

    // Lighting setup matching IngeTrazo matte architectural shading:
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.72);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.55);
    sunLight.position.set(45, -55, 75);
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xa5b4fc, 0.25);
    fillLight.position.set(-35, 45, -25);
    scene.add(fillLight);

    // Ground Grid Helper (XY Plane at Z=0)
    let gridHelper;
    function createGroundGrid(size = 50, divisions = 50, col1 = 0x94a3b8, col2 = 0xcbd5e1) {
      if (gridHelper) scene.remove(gridHelper);
      gridHelper = new THREE.GridHelper(size, divisions, col1, col2);
      gridHelper.rotation.x = Math.PI / 2;
      gridHelper.position.z = 0;
      scene.add(gridHelper);
    }

    // Geometry Construction & Texture Loading
    let modelGroup = new THREE.Group();
    scene.add(modelGroup);

    let partEntries = [];
    let edgeLineMesh, modelBounds, modelCenter, modelRadius;

    // Load Textures from Base64 Data URIs
    const textureLoader = new THREE.TextureLoader();
    const loadedTextures = {};

    function initTextures() {
      const texEntries = Object.entries(MODEL_PAYLOAD.textures || {});
      for (const [id, dataUri] of texEntries) {
        const tex = textureLoader.load(dataUri, () => {
          renderer.render(scene, camera);
        });
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        loadedTextures[id] = tex;
      }
    }

    function buildModel() {
      initTextures();

      const parts = MODEL_PAYLOAD.parts || [];
      const edges = MODEL_PAYLOAD.edges || [];

      // Calculate overall bounds
      const bbox = new THREE.Box3();

      if (parts.length > 0) {
        for (const p of parts) {
          if (!p.vertices || p.vertices.length === 0) continue;

          const geom = new THREE.BufferGeometry();
          geom.setAttribute('position', new THREE.Float32BufferAttribute(p.vertices, 3));

          if (p.uvs && p.uvs.length > 0) {
            geom.setAttribute('uv', new THREE.Float32BufferAttribute(p.uvs, 2));
          }

          if (p.colors && p.colors.length > 0 && !p.textureId) {
            geom.setAttribute('color', new THREE.Float32BufferAttribute(p.colors, 3));
          }

          geom.computeVertexNormals();
          geom.computeBoundingBox();
          bbox.union(geom.boundingBox);

          // Build Material
          const hasTex = (p.textureId && loadedTextures[p.textureId]);
          const baseColor = p.color ? new THREE.Color(p.color[0], p.color[1], p.color[2]) : new THREE.Color(0xf5f2ec);

          const mat = new THREE.MeshStandardMaterial({
            map: hasTex ? loadedTextures[p.textureId] : null,
            color: hasTex ? 0xffffff : baseColor,
            roughness: 0.88,
            metalness: 0.02,
            side: THREE.DoubleSide,
            polygonOffset: true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits: 1,
            transparent: (p.opacity < 0.99),
            opacity: p.opacity !== undefined ? p.opacity : 1.0,
          });

          const mesh = new THREE.Mesh(geom, mat);
          modelGroup.add(mesh);

          partEntries.push({
            mesh: mesh,
            originalMap: hasTex ? loadedTextures[p.textureId] : null,
            originalColor: baseColor,
            originalOpacity: p.opacity !== undefined ? p.opacity : 1.0,
            hasTexture: hasTex,
          });
        }
      } else if (MODEL_PAYLOAD.vertices && MODEL_PAYLOAD.vertices.length > 0) {
        // Fallback for simple flat models
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(MODEL_PAYLOAD.vertices, 3));
        if (MODEL_PAYLOAD.colors) {
          geom.setAttribute('color', new THREE.Float32BufferAttribute(MODEL_PAYLOAD.colors, 3));
        }
        geom.computeVertexNormals();
        geom.computeBoundingBox();
        bbox.union(geom.boundingBox);

        const mat = new THREE.MeshStandardMaterial({
          roughness: 0.88,
          metalness: 0.02,
          vertexColors: Boolean(MODEL_PAYLOAD.colors && MODEL_PAYLOAD.colors.length > 0),
          color: 0xffffff,
          side: THREE.DoubleSide,
          polygonOffset: true,
          polygonOffsetFactor: 1,
          polygonOffsetUnits: 1
        });
        const mesh = new THREE.Mesh(geom, mat);
        modelGroup.add(mesh);
        partEntries.push({
          mesh: mesh,
          originalMap: null,
          originalColor: new THREE.Color(0xf5f2ec),
          originalOpacity: 1.0,
          hasTexture: false
        });
      }

      modelBounds = bbox;
      modelCenter = new THREE.Vector3();
      bbox.getCenter(modelCenter);

      const sphere = new THREE.Sphere();
      bbox.getBoundingSphere(sphere);
      modelRadius = Math.max(sphere.radius, 1.0);

      // Create ground grid adapted to model scale
      const gridSize = Math.max(Math.ceil(modelRadius * 3 / 10) * 10, 20);
      createGroundGrid(gridSize, gridSize, 0x94a3b8, 0xcbd5e1);

      // 2. Build Crisp IngeTrazo Edge Lines (#212b3b)
      let edgeGeom;
      if (edges && edges.length >= 6) {
        edgeGeom = new THREE.BufferGeometry();
        edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edges, 3));
      } else {
        // Fallback to bounding edges if no extracted edges
        const fullGeom = new THREE.BufferGeometry();
        fullGeom.setAttribute('position', new THREE.Float32BufferAttribute(MODEL_PAYLOAD.vertices || [], 3));
        edgeGeom = new THREE.EdgesGeometry(fullGeom, 15);
      }

      const edgeMat = new THREE.LineBasicMaterial({
        color: 0x212b3b, // IngeTrazo exact edge color
        linewidth: 1.5,
        transparent: true,
        opacity: 0.95
      });

      edgeLineMesh = new THREE.LineSegments(edgeGeom, edgeMat);
      scene.add(edgeLineMesh);

      // Initial Camera Fit
      resetCamera();

      // Update Info Stats
      updateStatsUI(edges);
    }

    function resetCamera() {
      if (!modelCenter || !modelRadius) return;
      const dist = modelRadius * 2.3;
      camera.position.set(modelCenter.x + dist * 0.7, modelCenter.y - dist * 0.9, modelCenter.z + dist * 0.65);
      controls.target.copy(modelCenter);
      camera.near = modelRadius * 0.01;
      camera.far = modelRadius * 50;
      camera.updateProjectionMatrix();
      controls.update();
    }

    function setView(type) {
      if (!modelCenter || !modelRadius) return;
      const d = modelRadius * 2.4;
      controls.target.copy(modelCenter);

      if (type === 'top') {
        camera.position.set(modelCenter.x, modelCenter.y + 0.0001, modelCenter.z + d);
      } else if (type === 'front') {
        camera.position.set(modelCenter.x, modelCenter.y - d, modelCenter.z);
      } else if (type === 'right') {
        camera.position.set(modelCenter.x + d, modelCenter.y, modelCenter.z);
      } else if (type === 'iso') {
        camera.position.set(modelCenter.x + d * 0.7, modelCenter.y - d * 0.7, modelCenter.z + d * 0.65);
      }
      controls.update();
    }

    // Interactive Toggles
    function toggleEdges() {
      if (!edgeLineMesh) return;
      edgeLineMesh.visible = !edgeLineMesh.visible;
      document.getElementById('btn-edges').classList.toggle('active', edgeLineMesh.visible);
    }

    function toggleGrid() {
      if (!gridHelper) return;
      gridHelper.visible = !gridHelper.visible;
      document.getElementById('btn-grid').classList.toggle('active', gridHelper.visible);
    }

    // IngeTrazo Native Styles Palette
    let currentStyleIndex = 0;
    const INGETRAZO_STYLES = [
      {
        name: "IngeTrazo Shaded",
        bg: 0xe6e8eb,
        edgeColor: 0x212b3b,
        mode: "shaded",
        opacity: 1.0,
        grid1: 0x94a3b8,
        grid2: 0xcbd5e1,
      },
      {
        name: "Hidden Line",
        bg: 0xffffff,
        edgeColor: 0x111827,
        mode: "hidden_line",
        opacity: 1.0,
        grid1: 0xd1d5db,
        grid2: 0xf3f4f6,
      },
      {
        name: "Monochrome",
        bg: 0xe6e8eb,
        edgeColor: 0x212b3b,
        mode: "monochrome",
        opacity: 1.0,
        grid1: 0x94a3b8,
        grid2: 0xcbd5e1,
      },
      {
        name: "X-Ray",
        bg: 0xe6e8eb,
        edgeColor: 0x212b3b,
        mode: "xray",
        opacity: 0.45,
        grid1: 0x94a3b8,
        grid2: 0xcbd5e1,
      },
      {
        name: "Dark Studio",
        bg: 0x0b0f19,
        edgeColor: 0x38bdf8,
        mode: "shaded",
        opacity: 1.0,
        grid1: 0x0284c7,
        grid2: 0x1e293b,
      }
    ];

    function cycleStyle() {
      currentStyleIndex = (currentStyleIndex + 1) % INGETRAZO_STYLES.length;
      const st = INGETRAZO_STYLES[currentStyleIndex];

      document.getElementById('style-name').textContent = st.name.replace("IngeTrazo ", "");
      scene.background.setHex(st.bg);

      // Update edges
      if (edgeLineMesh) {
        edgeLineMesh.material.color.setHex(st.edgeColor);
      }

      // Update mesh shading and transparency across all parts
      for (const entry of partEntries) {
        const mat = entry.mesh.material;

        if (st.mode === "hidden_line") {
          mat.map = null;
          mat.color.setHex(0xffffff);
          mat.transparent = false;
          mat.opacity = 1.0;
        } else if (st.mode === "monochrome") {
          mat.map = null;
          mat.color.setHex(0xf5f2ec); // Default warm plaster
          mat.transparent = false;
          mat.opacity = 1.0;
        } else if (st.mode === "xray") {
          mat.map = entry.originalMap;
          mat.color.copy(entry.originalColor);
          mat.transparent = true;
          mat.opacity = st.opacity;
        } else {
          // Shaded (Native IngeTrazo with textures)
          mat.map = entry.originalMap;
          mat.color.copy(entry.originalColor);
          mat.transparent = (entry.originalOpacity < 0.99);
          mat.opacity = entry.originalOpacity;
        }
        mat.needsUpdate = true;
      }

      // Update Ground Grid
      if (gridHelper) {
        scene.remove(gridHelper);
        const gridSize = Math.max(Math.ceil(modelRadius * 3 / 10) * 10, 20);
        createGroundGrid(gridSize, gridSize, st.grid1, st.grid2);
      }
    }

    function toggleStats() {
      const card = document.getElementById('stats-card');
      card.classList.toggle('visible');
      document.getElementById('btn-info').classList.toggle('active', card.classList.contains('visible'));
    }

    function updateStatsUI(edges) {
      const triCount = (MODEL_PAYLOAD.faceCount || 0).toLocaleString();
      const edgeCount = (edges ? edges.length / 6 : 0).toLocaleString();
      const vertCount = (MODEL_PAYLOAD.vertexCount || 0).toLocaleString();
      const texCount = (MODEL_PAYLOAD.textureCount || 0).toLocaleString();
      const dx = (modelBounds.max.x - modelBounds.min.x).toFixed(2);
      const dy = (modelBounds.max.y - modelBounds.min.y).toFixed(2);
      const dz = (modelBounds.max.z - modelBounds.min.z).toFixed(2);
      const cx = modelCenter.x.toFixed(2);
      const cy = modelCenter.y.toFixed(2);
      const cz = modelCenter.z.toFixed(2);

      document.getElementById('stat-triangles').textContent = triCount;
      document.getElementById('stat-edges').textContent = edgeCount;
      document.getElementById('stat-textures').textContent = texCount;
      document.getElementById('stat-vertices').textContent = vertCount;
      document.getElementById('stat-dims').textContent = `${dx}m × ${dy}m × ${dz}m`;
      document.getElementById('stat-center').textContent = `(${cx}, ${cy}, ${cz})`;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      // Sync Gizmo Camera with main camera orientation
      gizmoCamera.position.copy(camera.position).sub(controls.target).normalize().multiplyScalar(4.5);
      gizmoCamera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
      gizmoRenderer.render(gizmoScene, gizmoCamera);
    }

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialize
    buildModel();
    animate();
  </script>
</body>
</html>
