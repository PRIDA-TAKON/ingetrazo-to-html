<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>__MODEL_TITLE__ — 3D Web Viewer</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(15, 23, 42, 0.75);
      --panel-border: rgba(56, 189, 248, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --btn-bg: rgba(30, 41, 59, 0.8);
      --btn-hover: rgba(51, 65, 85, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }

    #viewport-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Top Branding & Info */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .badge-icon {
      width: 20px;
      height: 20px;
      display: inline-block;
    }

    .model-info h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text-main);
    }

    .model-info p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Floating Toolbar */
    .floating-toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 6px 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    }

    .tool-btn {
      background: var(--btn-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .tool-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* Right Stats & Quick Nav */
    .view-presets {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 6px;
    }

    .preset-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .preset-btn:hover {
      background: var(--btn-hover);
      color: var(--accent);
    }

    /* Stats Modal / Card */
    .stats-card {
      position: absolute;
      top: 80px;
      left: 20px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 12px;
      color: var(--text-muted);
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .stats-card.visible {
      display: block;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 6px;
    }

    .stats-row span.val {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Compass / Axis Indicator */
    #axis-gizmo {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 80px;
      height: 80px;
      z-index: 10;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .top-bar { top: 10px; left: 10px; }
      .view-presets { top: 10px; right: 10px; }
      .floating-toolbar { bottom: 12px; padding: 4px 6px; gap: 4px; }
      .tool-btn { padding: 6px 8px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="viewport-container"></div>

  <!-- Top Title Badge -->
  <div class="top-bar">
    <div class="badge">
      <svg class="badge-icon" viewBox="0 0 24 24" fill="none">
        <polygon points="12,2.5 20.5,7.2 12,11.9 3.5,7.2" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="3.5,7.2 12,11.9 12,21.5 3.5,16.8" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="20.5,7.2 12,11.9 12,21.5 20.5,16.8" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round"/>
        <polyline points="9,14.2 6.5,15.7 9,17.2" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/>
        <polyline points="15,14.2 17.5,15.7 15,17.2" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div class="model-info">
        <h1>__MODEL_TITLE__</h1>
        <p>IngeTrazo 3D Web • __MODEL_DATE__</p>
      </div>
    </div>
  </div>

  <!-- Quick Views -->
  <div class="view-presets">
    <button class="preset-btn" onclick="setView('iso')">3D ISO</button>
    <button class="preset-btn" onclick="setView('top')">TOP</button>
    <button class="preset-btn" onclick="setView('front')">FRONT</button>
    <button class="preset-btn" onclick="setView('right')">RIGHT</button>
  </div>

  <!-- Bottom Floating Toolbar -->
  <div class="floating-toolbar">
    <button class="tool-btn" onclick="resetCamera()" title="Reset Camera View">
      <span>🎯</span> Reset
    </button>
    <div class="divider"></div>
    <button class="tool-btn" id="btn-wire" onclick="toggleWireframe()" title="Toggle Wireframe">
      <span>🕸️</span> Wire
    </button>
    <button class="tool-btn active" id="btn-grid" onclick="toggleGrid()" title="Toggle Ground Grid">
      <span>📐</span> Grid
    </button>
    <button class="tool-btn" id="btn-theme" onclick="cycleTheme()" title="Switch Environment Theme">
      <span>🎨</span> Theme
    </button>
    <div class="divider"></div>
    <button class="tool-btn" id="btn-info" onclick="toggleStats()" title="Model Statistics">
      <span>📊</span> Info
    </button>
    <button class="tool-btn" onclick="toggleFullscreen()" title="Fullscreen">
      <span>⛶</span>
    </button>
  </div>

  <!-- Model Stats Card -->
  <div class="stats-card" id="stats-card">
    <div class="stats-row"><span>Faces / Triangles:</span><span class="val" id="stat-triangles">-</span></div>
    <div class="stats-row"><span>Vertices:</span><span class="val" id="stat-vertices">-</span></div>
    <div class="stats-row"><span>Dimensions (W×L×H):</span><span class="val" id="stat-dims">-</span></div>
    <div class="stats-row"><span>Center Datum:</span><span class="val" id="stat-center">-</span></div>
  </div>

  <!-- Embedded Three.js Engine -->
  <script>
/* __THREE_JS__ */
  </script>

  <!-- Embedded OrbitControls -->
  <script>
/* __ORBIT_CONTROLS__ */
  </script>

  <!-- Model Data & Interactive Viewer Script -->
  <script>
    const MODEL_PAYLOAD = /* __MODEL_DATA__ */;

    // Set Default Up vector to Z-up (+Z is Sky in IngeTrazo / BIM CAD)
    if (THREE.Object3D.DefaultUp) {
      THREE.Object3D.DefaultUp.set(0, 0, 1);
    }

    const container = document.getElementById('viewport-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f19);

    // Camera setup
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    // OrbitControls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.screenSpacePanning = true;
    controls.maxPolarAngle = Math.PI - 0.05;

    // Lighting setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight1.position.set(40, -50, 70);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x90b0d0, 0.45);
    dirLight2.position.set(-40, 50, 40);
    scene.add(dirLight2);

    // Ground Grid Helper (XY Plane at Z=0)
    let gridHelper;
    function createGroundGrid(size = 50, divisions = 50) {
      if (gridHelper) scene.remove(gridHelper);
      gridHelper = new THREE.GridHelper(size, divisions, 0x38bdf8, 0x1e293b);
      // Three.js GridHelper is on XZ plane by default; rotate 90 deg around X to lie on XY plane
      gridHelper.rotation.x = Math.PI / 2;
      gridHelper.position.z = 0;
      scene.add(gridHelper);
    }

    // Geometry Construction
    let modelMesh, wireMesh, modelBounds, modelCenter, modelRadius;

    function buildModel() {
      const vertices = MODEL_PAYLOAD.vertices || [];
      const colors = MODEL_PAYLOAD.colors || [];

      if (!vertices || vertices.length === 0) {
        console.warn('No vertices in model payload');
        return;
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

      if (colors && colors.length === vertices.length) {
        geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      }

      geom.computeVertexNormals();
      geom.computeBoundingBox();
      geom.computeBoundingSphere();

      modelBounds = geom.boundingBox;
      modelCenter = geom.boundingSphere.center;
      modelRadius = Math.max(geom.boundingSphere.radius, 1.0);

      // Create ground grid adapted to model scale
      const gridSize = Math.max(Math.ceil(modelRadius * 3 / 10) * 10, 20);
      createGroundGrid(gridSize, gridSize);

      // Material: DoubleSide with vertex colors and subtle roughness
      const mat = new THREE.MeshStandardMaterial({
        roughness: 0.35,
        metalness: 0.12,
        vertexColors: (colors.length > 0),
        color: (colors.length === 0) ? 0xe2e8f0 : 0xffffff,
        side: THREE.DoubleSide
      });

      modelMesh = new THREE.Mesh(geom, mat);
      scene.add(modelMesh);

      // Wireframe / Edges layer
      const edges = new THREE.EdgesGeometry(geom, 22);
      wireMesh = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        opacity: 0.5,
        transparent: true
      }));
      wireMesh.visible = false;
      scene.add(wireMesh);

      // Initial Camera Fit
      resetCamera();

      // Update Info Stats
      updateStatsUI(geom);
    }

    function resetCamera() {
      if (!modelCenter || !modelRadius) return;
      const dist = modelRadius * 2.4;
      camera.position.set(modelCenter.x + dist * 0.7, modelCenter.y - dist * 0.9, modelCenter.z + dist * 0.6);
      controls.target.copy(modelCenter);
      camera.near = modelRadius * 0.01;
      camera.far = modelRadius * 50;
      camera.updateProjectionMatrix();
      controls.update();
    }

    function setView(type) {
      if (!modelCenter || !modelRadius) return;
      const d = modelRadius * 2.5;
      controls.target.copy(modelCenter);

      if (type === 'top') {
        camera.position.set(modelCenter.x, modelCenter.y + 0.001, modelCenter.z + d);
      } else if (type === 'front') {
        camera.position.set(modelCenter.x, modelCenter.y - d, modelCenter.z);
      } else if (type === 'right') {
        camera.position.set(modelCenter.x + d, modelCenter.y, modelCenter.z);
      } else if (type === 'iso') {
        camera.position.set(modelCenter.x + d * 0.7, modelCenter.y - d * 0.7, modelCenter.z + d * 0.6);
      }
      controls.update();
    }

    // Interactive Toggles
    function toggleWireframe() {
      if (!wireMesh) return;
      wireMesh.visible = !wireMesh.visible;
      document.getElementById('btn-wire').classList.toggle('active', wireMesh.visible);
    }

    function toggleGrid() {
      if (!gridHelper) return;
      gridHelper.visible = !gridHelper.visible;
      document.getElementById('btn-grid').classList.toggle('active', gridHelper.visible);
    }

    let themeIndex = 0;
    const themes = [
      { name: 'Dark Slate', bg: 0x0b0f19, grid1: 0x38bdf8, grid2: 0x1e293b },
      { name: 'Studio White', bg: 0xf1f5f9, grid1: 0x94a3b8, grid2: 0xe2e8f0 },
      { name: 'Blueprint Blue', bg: 0x082f49, grid1: 0x38bdf8, grid2: 0x0c4a6e }
    ];

    function cycleTheme() {
      themeIndex = (themeIndex + 1) % themes.length;
      const th = themes[themeIndex];
      scene.background.setHex(th.bg);
      if (gridHelper) {
        scene.remove(gridHelper);
        const gridSize = Math.max(Math.ceil(modelRadius * 3 / 10) * 10, 20);
        gridHelper = new THREE.GridHelper(gridSize, gridSize, th.grid1, th.grid2);
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);
      }
    }

    function toggleStats() {
      const card = document.getElementById('stats-card');
      card.classList.toggle('visible');
      document.getElementById('btn-info').classList.toggle('active', card.classList.contains('visible'));
    }

    function updateStatsUI(geom) {
      const triCount = (geom.attributes.position.count / 3).toLocaleString();
      const vertCount = geom.attributes.position.count.toLocaleString();
      const dx = (modelBounds.max.x - modelBounds.min.x).toFixed(2);
      const dy = (modelBounds.max.y - modelBounds.min.y).toFixed(2);
      const dz = (modelBounds.max.z - modelBounds.min.z).toFixed(2);
      const cx = modelCenter.x.toFixed(2);
      const cy = modelCenter.y.toFixed(2);
      const cz = modelCenter.z.toFixed(2);

      document.getElementById('stat-triangles').textContent = triCount;
      document.getElementById('stat-vertices').textContent = vertCount;
      document.getElementById('stat-dims').textContent = `${dx}m × ${dy}m × ${dz}m`;
      document.getElementById('stat-center').textContent = `(${cx}, ${cy}, ${cz})`;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialize
    buildModel();
    animate();
  </script>
</body>
</html>
