<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Isometric 3D Wireframe Cube with HTML Code Marks -->
  <!-- Top Face -->
  <polygon points="12,2.5 20.5,7.2 12,11.9 3.5,7.2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Face Outline -->
  <polygon points="3.5,7.2 12,11.9 12,21.5 3.5,16.8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Face Outline -->
  <polygon points="20.5,7.2 12,11.9 12,21.5 20.5,16.8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left Face: "<" HTML Code Bracket -->
  <polyline points="9,14.2 6.5,15.7 9,17.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Face: ">" HTML Code Bracket -->
  <polyline points="15,14.2 17.5,15.7 15,17.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Face: Accent Sphere / Web Orbit Center -->
  <circle cx="12" cy="7.2" r="1.3" fill="currentColor"/>
</svg>
