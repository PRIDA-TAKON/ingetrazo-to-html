en = "Export completed 3D architectural models with textures and crisp edge lines into a single standalone .html file. Perfect for sending to clients, contractors, and collaborators who do NOT have IngeTrazo installed. Can be opened by double-clicking in any web browser (Chrome, Edge, Safari, Firefox) on PC, Mac, iPad, iPhone, and Android completely offline without installing any software or plugins."
es = "Exporta modelos arquitectónicos 3D terminados con texturas y aristas nítidas a un único archivo .html independiente. Ideal para enviar a clientes, constructores y colaboradores que NO tienen IngeTrazo instalado. Se abre con doble clic en cualquier navegador web en PC, Mac o teléfonos móviles, de forma 100% autónoma y sin conexión."
pt = "Exporte modelos arquitetônicos 3D concluídos com texturas e arestas nítidas em um único arquivo .html autônomo. Perfeito para enviar a clientes, construtores e colaboradores que NÃO possuem o IngeTrazo instalado. Abre com duplo clique em qualquer navegador web no PC ou celular, totalmente offline e sem instalar programas."
